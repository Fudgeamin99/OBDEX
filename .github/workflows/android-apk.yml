name: Android APK

on:
  push:
    branches: [main]
    paths: ['obdex-mobile/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # The hosted OBDEX server (obdex-app) that holds the DVSA and DVLA keys.
      # Set it under Settings > Secrets and variables > Actions > Variables.
      # Left empty, the APK runs on demo data.
      EXPO_PUBLIC_API_URL: ${{ vars.OBDEX_API_URL }}
      # Lets the app spot when a newer build is on the android-latest release.
      EXPO_PUBLIC_BUILD_SHA: ${{ github.sha }}
    defaults:
      run:
        working-directory: obdex-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: obdex-mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo prebuild --platform android --no-install
      - run: ./gradlew assembleRelease --no-daemon
        working-directory: obdex-mobile/android
      - uses: actions/upload-artifact@v4
        with:
          name: obdex-android-apk
          path: obdex-mobile/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Publish to the android-latest release
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk OBDEX.apk
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest OBDEX.apk --prerelease --target "$GITHUB_SHA" \
            --title "OBDEX Android (latest build)" \
            --notes "Built from $GITHUB_SHA. Download OBDEX.apk on your Android phone and open it to install."
        env:
          GH_TOKEN: ${{ github.token }}
